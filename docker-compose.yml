services:
  backend:
    build: ./backend
    ports:
      - "5178:5178"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=your-secret-key
      - NODE_ENV=production
    volumes:
      - ./backend/prisma:/app/prisma
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    restart: unless-stopped